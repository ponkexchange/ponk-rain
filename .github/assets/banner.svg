<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ponk Rain: the launch kit and SDK for Ponk Clouds, the zero-protocol-fee DLMM on Solana.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc9d7"/>
      <stop offset="0.55" stop-color="#ff7eb6"/>
      <stop offset="1" stop-color="#22d1ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="0%" r="80%">
      <stop offset="0" stop-color="#ff9ec4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9d7"/>
      <stop offset="1" stop-color="#22d1ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#07070a"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- rain cloud motif -->
  <g transform="translate(150,150)">
    <!-- cloud -->
    <path d="M-66 6 a34 34 0 0 1 12 -66 a44 44 0 0 1 84 -10 a30 30 0 0 1 24 76 z"
          fill="none" stroke="url(#brand)" stroke-width="6" stroke-linejoin="round"/>
    <!-- rain streaks -->
    <g stroke="url(#drop)" stroke-width="5" stroke-linecap="round">
      <line x1="-44" y1="26" x2="-54" y2="70"/>
      <line x1="-14" y1="30" x2="-24" y2="84"/>
      <line x1="16" y1="30" x2="6" y2="74"/>
      <line x1="46" y1="26" x2="36" y2="70"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="158" fill="#ffffff" font-size="78" font-weight="800" letter-spacing="-2">Ponk Rain</text>
  <rect x="302" y="184" width="150" height="6" rx="3" fill="url(#brand)"/>

  <!-- tagline -->
  <text x="302" y="226" fill="#c9c9d2" font-size="23" font-weight="500">Launch kit + SDK for Ponk Clouds, the zero-protocol-fee DLMM on Solana.</text>

  <!-- chips -->
  <g font-size="15" font-weight="600">
    <g transform="translate(302,262)">
      <rect width="118" height="34" rx="17" fill="#15151c" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="17" r="5" fill="url(#brand)"/>
      <text x="38" y="22" fill="#e8e8ee">Solana</text>
    </g>
    <g transform="translate(432,262)">
      <rect width="196" height="34" rx="17" fill="#15151c" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="17" r="5" fill="#4ade9e"/>
      <text x="38" y="22" fill="#e8e8ee">0% protocol fee</text>
    </g>
    <g transform="translate(640,262)">
      <rect width="168" height="34" rx="17" fill="#15151c" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="22" cy="17" r="5" fill="#22d1ee"/>
      <text x="38" y="22" fill="#e8e8ee">non-custodial</text>
    </g>
  </g>
</svg>
